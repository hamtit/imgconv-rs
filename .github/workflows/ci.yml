name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build in Debian bookworm (glibc 2.36), the base of
  # oven/bun:*-debian images, so the addon loads there.
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            triple: linux-x64-gnu
          - runner: ubuntu-24.04-arm
            triple: linux-arm64-gnu
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    env:
      # sccache wraps rustc and the C/C++ compilers CMake invokes for
      # libaom / libjxl (CMake reads CMAKE_<LANG>_COMPILER_LAUNCHER from
      # the environment), so both the test build and the addon build, and
      # later runs, reuse the same object files.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake nasm clang libclang-dev \
            curl ca-certificates git python3 pkg-config unzip
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Fetch codec sources
        run: ./scripts/fetch-deps.sh
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ matrix.triple }}-${{ hashFiles('Cargo.lock', 'vendor/*/.version', 'build.rs') }}
          restore-keys: |
            ${{ matrix.triple }}-
      - name: Rust unit tests
        run: cargo test --release --no-default-features
      - name: Build addon
        run: ./scripts/build.sh
      - name: Addon tests
        run: |
          bun install --frozen-lockfile
          bun test test/
      - name: sccache stats
        if: always()
        run: sccache --show-stats
      - uses: actions/upload-artifact@v4
        with:
          name: addon-${{ matrix.triple }}
          path: imgconv-rs.${{ matrix.triple }}.node

  # On a v* tag: one npm tarball with both binaries, attached to a GitHub
  # release, so it can be depended on by URL.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: addon-*
          merge-multiple: true
      - name: Collect licenses
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends nasm
          ./scripts/fetch-deps.sh
          ./scripts/collect-licenses.sh
      - name: Pack
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm version --no-git-tag-version --allow-same-version "$version"
          npm pack
      - uses: softprops/action-gh-release@v2
        with:
          files: imgconv-rs-*.tgz
